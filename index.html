<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Sportsoft API Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        spec: {
          "openapi": "3.0.3",
          "info": {
            "title": "Sportsoft API",
            "description": "Complete REST API specification for SportSoft timekeeping - start lists, results, etc.",
            "version": "1.0.0"
          },
          "servers": [
            { "url": "https://live.sportsoft.cz/api", "description": "Produkční server" }
          ],
          "paths": {
            "/setup/race/{raceId}": {
              "get": {
                "summary": "1. Race Setup API",
                "description": "Returns the complete event structure including competitions, sections, categories, and starting wave times.",
                "parameters": [
                  { "name": "raceId", "in": "path", "required": true, "description": "Unique race ID (e.g. 880)", "schema": { "type": "integer", "example": 880 } }
                ],
                "responses": {
                  "200": {
                    "description": "Successfully obtaining configuration",
                    "content": {
                      "application/json": {
                        "schema": { "$ref": "#/components/schemas/RaceSetup" }
                      }
                    }
                  },
                  "404": { "description": "Race not found" }
                }
              }
            },
            "/competitors/race/{raceId}": {
              "get": {
                "summary": "2. Competitors API",
                "description": "Returns an array of competitions with a complete list of competitors, their starting numbers, clubs, and registration status.",
                "parameters": [
                  { "name": "raceId", "in": "path", "required": true, "description": "Unique race ID (e.g. 880)", "schema": { "type": "integer", "example": 880 } }
                ],
                "responses": {
                  "200": {
                    "description": "Successfully obtaining the list of competitors",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "array",
                          "items": { "$ref": "#/components/schemas/CompetitionCompetitors" }
                        }
                      }
                    }
                  },
                  "404": { "description": "Race not found" }
                }
              }
            },
            "/results/race/{raceId}": {
              "get": {
                "summary": "3. Results API",
                "description": "Returns live or final race results structured by timed sections (splits) including order and times.",
                "parameters": [
                  { "name": "raceId", "in": "path", "required": true, "description": "Unique race ID (e.g. 880)", "schema": { "type": "integer", "example": 880 } }
                ],
                "responses": {
                  "200": {
                    "description": "Successfully obtaining results",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "array",
                          "items": { "$ref": "#/components/schemas/CompetitionResults" }
                        }
                      }
                    }
                  },
                  "404": { "description": "Race not found" }
                }
              }
            }
          },
          "components": {
            "schemas": {
              "RaceSetup": {
                "type": "object",
                "properties": {
                  "Id": { "type": "integer", "example": 880 },
                  "Name": { "type": "string", "example": "SportSoft race" },
                  "Competitions": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/CompetitionSetup" }
                  }
                }
              },
              "CompetitionSetup": {
                "type": "object",
                "properties": {
                  "Id": { "type": "integer", "example": 6245 },
                  "Name": { "type": "string", "example": "50 km" },
                  "Ranks": { "type": "boolean", "example": true },
                  "Distance": { "type": "number", "example": 50 },
                  "Splits": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Split" }
                  },
                  "Categories": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Category" }
                  },
                  "StartTimes": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/StartTime" }
                  }
                }
              },
              "Split": {
                "type": "object",
                "properties": {
                  "Name": { "type": "string", "example": "Split 10 km" },
                  "Distance": { "type": "string", "example": "10" },
                  "IsStart": { "type": "boolean", "example": false },
                  "IsFinish": { "type": "boolean", "example": false }
                }
              },
              "Category": {
                "type": "object",
                "properties": {
                  "LongName": { "type": "string", "example": "Men Elite" },
                  "ShortName": { "type": "string", "example": "ME" },
                  "MinYear": { "type": "integer", "example": 1920 },
                  "MaxYear": { "type": "integer", "example": 2004 },
                  "Gender": { "type": "string", "example": "male" },
                  "Entries": { "type": "integer", "example": 156 }
                }
              },
              "StartTime": {
                "type": "object",
                "properties": {
                  "Name": { "type": "string", "example": "Elite Men" },
                  "Planned": { "type": "string", "example": "10:00:00" },
                  "GunTime": { "type": "string", "example": "10:00:02" }
                }
              },
              "CompetitionCompetitors": {
                "type": "object",
                "properties": {
                  "Id": { "type": "integer", "example": 6245 },
                  "Name": { "type": "string", "example": "50 km" },
                  "Distance": { "type": "number", "example": 50 },
                  "Competitors": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Competitor" }
                  }
                }
              },
              "Competitor": {
                "type": "object",
                "properties": {
                  "RaceNo": { "type": "string", "example": "84" },
                  "Firstname": { "type": "string", "example": "NameABC" },
                  "Lastname": { "type": "string", "example": "LastNameABC" },
                  "Gender": { "type": "string", "example": "male" },
                  "YearOfBirth": { "type": "integer", "example": 2006 },
                  "Nation": { "type": "string", "example": "CZE" },
                  "Club": { "type": "string", "nullable": true, "example": "SportSoft timing club" },
                  "Category": { "type": "string", "example": "M20-24" },
                  "Status": { "type": "string", "example": "OK" },
                  "RegistrationComplete": { "type": "boolean", "example": true }
                }
              },
              "CompetitionResults": {
                "type": "object",
                "properties": {
                  "Id": { "type": "integer", "example": 6245 },
                  "Name": { "type": "string", "example": "50 km" },
                  "Distance": { "type": "number", "example": 50 },
                  "Splits": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/ResultSplit" }
                  }
                }
              },
              "ResultSplit": {
                "type": "object",
                "properties": {
                  "Order": { "type": "integer", "example": 1 },
                  "Name": { "type": "string", "example": "10 km" },
                  "IsStart": { "type": "boolean", "example": false },
                  "IsFinish": { "type": "boolean", "example": false },
                  "Results": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/CompetitorResult" }
                  }
                }
              },
              "CompetitorResult": {
                "type": "object",
                "properties": {
                  "RaceNo": { "type": "string", "example": "31" },
                  "Firstname": { "type": "string", "example": "NameABC" },
                  "Lastname": { "type": "string", "example": "LastNameABC" },
                  "Gender": { "type": "string", "example": "male" },
                  "YearOfBirth": { "type": "integer", "example": 1996 },
                  "Nation": { "type": "string", "example": "CZE" },
                  "Club": { "type": "string", "nullable": true, "example": null },
                  "Time": { "type": "string", "nullable": true, "example": "00:08:07.397" },
                  "Pos": { "type": "integer", "nullable": true, "example": 1 },
                  "PosGender": { "type": "integer", "nullable": true, "example": 1 },
                  "PosCategory": { "type": "integer", "nullable": true, "example": 1 },
                  "Category": { "type": "string", "example": "ME" },
                  "FinishTime": { "type": "string", "nullable": true, "example": null },
                  "FinishPos": { "type": "integer", "nullable": true, "example": null },
                  "FinishPosGender": { "type": "integer", "nullable": true, "example": null },
                  "FinishPosCategory": { "type": "integer", "nullable": true, "example": null },
                  "KOMPos": { "type": "integer", "nullable": true, "example": null },
                  "KOMPoints": { "type": "number", "nullable": true, "example": null },
                  "SprintPos": { "type": "integer", "nullable": true, "example": null },
                  "SprintPoints": { "type": "number", "nullable": true, "example": null }
                }
              }
            }
          }
        },
        dom_id: '#swagger-ui',
        deepLinking: true
      });
    };
  </script>
</body>
</html>
